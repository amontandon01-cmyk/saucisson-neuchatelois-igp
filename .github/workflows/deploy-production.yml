name: Déployer en production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - deploy/production-request.txt

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: igp-pages-publication
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://amontandon01-cmyk.github.io/saucisson-neuchatelois-igp/
    steps:
      - name: Vérifier la branche
        run: test "$GITHUB_REF_NAME" = main
      - name: Récupérer le commit exact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identifier automatiquement la version validée
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            release_sha="$(tr -d '[:space:]' < deploy/production-request.txt)"
            [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$release_sha^{commit}"
            changed_paths="$(git diff --name-only "$release_sha" "$GITHUB_SHA")"
            test "$changed_paths" = deploy/production-request.txt
          else
            release_sha="$GITHUB_SHA"
          fi
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
      - name: Préparer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Installer et contrôler les deux environnements
        run: |
          npm ci
          npm run check
          git diff --exit-code
      - name: Identifier la production actuellement publiée
        id: current_production
        run: node scripts/resolve-production-revision.mjs
      - name: Prouver que cette version est actuellement en préproduction
        run: |
          node scripts/verify-live.mjs \
            preprod \
            "${{ steps.release.outputs.sha }}" \
            "${{ steps.current_production.outputs.sha }}"
      - name: Construire la production validée
        env:
          NEXT_PUBLIC_DEPLOY_ENV: production
          NEXT_PUBLIC_SITE_URL: https://amontandon01-cmyk.github.io
          NEXT_PUBLIC_BASE_PATH: /saucisson-neuchatelois-igp
          NEXT_PUBLIC_CANONICAL_BASE_PATH: /saucisson-neuchatelois-igp
          NEXT_PUBLIC_RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          npm run build
          mkdir -p .deploy/production-output
          cp -a out/. .deploy/production-output/
      - name: Reconstruire la préproduction avec le même contenu validé
        env:
          NEXT_PUBLIC_DEPLOY_ENV: preprod
          NEXT_PUBLIC_SITE_URL: https://amontandon01-cmyk.github.io
          NEXT_PUBLIC_BASE_PATH: /saucisson-neuchatelois-igp/preprod
          NEXT_PUBLIC_CANONICAL_BASE_PATH: /saucisson-neuchatelois-igp
          NEXT_PUBLIC_RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: npm run build
      - name: Composer les deux environnements
        run: |
          node scripts/compose-pages.mjs \
            .deploy/production-output \
            out \
            .deploy/pages
      - name: Charger le paquet GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .deploy/pages
      - name: Publier la version validée
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Vérifier la production et la préproduction publiées
        run: >-
          node scripts/verify-live.mjs production
          "${{ steps.release.outputs.sha }}"
          "${{ steps.release.outputs.sha }}"
      - name: Résumer la publication
        run: |
          printf 'Production publiée : %s\n\nVersion technique : `%s`\n' \
            'https://amontandon01-cmyk.github.io/saucisson-neuchatelois-igp/' \
            "${{ steps.release.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
