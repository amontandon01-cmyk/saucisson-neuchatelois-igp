name: Déployer en production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Après validation explicite de la préproduction, saisir PRODUCTION
        required: true
        type: string
      validated_sha:
        description: SHA complet du commit actuellement validé en préproduction
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: igp-pages-publication
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://amontandon01-cmyk.github.io/saucisson-neuchatelois-igp/
    steps:
      - name: Vérifier l’accord, la branche et le SHA
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          VALIDATED_SHA: ${{ inputs.validated_sha }}
        run: |
          test "$GITHUB_REF_NAME" = main
          test "$DEPLOY_CONFIRMATION" = PRODUCTION
          test "$VALIDATED_SHA" = "$GITHUB_SHA"
      - name: Récupérer le commit exact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Installer et contrôler les deux environnements
        run: |
          npm ci
          npm run check
          git diff --exit-code
      - name: Identifier la production actuellement publiée
        id: current_production
        run: node scripts/resolve-production-revision.mjs
      - name: Prouver que ce SHA est actuellement en préproduction
        run: |
          node scripts/verify-live.mjs \
            preprod \
            "$GITHUB_SHA" \
            "${{ steps.current_production.outputs.sha }}"
      - name: Construire la production validée
        env:
          NEXT_PUBLIC_DEPLOY_ENV: production
          NEXT_PUBLIC_SITE_URL: https://amontandon01-cmyk.github.io
          NEXT_PUBLIC_BASE_PATH: /saucisson-neuchatelois-igp
          NEXT_PUBLIC_CANONICAL_BASE_PATH: /saucisson-neuchatelois-igp
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
        run: |
          npm run build
          mkdir -p .deploy/production-output
          cp -a out/. .deploy/production-output/
      - name: Reconstruire la préproduction avec le même contenu validé
        env:
          NEXT_PUBLIC_DEPLOY_ENV: preprod
          NEXT_PUBLIC_SITE_URL: https://amontandon01-cmyk.github.io
          NEXT_PUBLIC_BASE_PATH: /saucisson-neuchatelois-igp/preprod
          NEXT_PUBLIC_CANONICAL_BASE_PATH: /saucisson-neuchatelois-igp
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
        run: npm run build
      - name: Composer les deux environnements
        run: |
          node scripts/compose-pages.mjs \
            .deploy/production-output \
            out \
            .deploy/pages
      - name: Charger le paquet GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .deploy/pages
      - name: Publier le SHA validé
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Vérifier la production et la préproduction publiées
        run: node scripts/verify-live.mjs production "$GITHUB_SHA" "$GITHUB_SHA"
      - name: Résumer la publication
        run: |
          printf 'Production publiée : %s\n\nSHA validé : `%s`\n' \
            'https://amontandon01-cmyk.github.io/saucisson-neuchatelois-igp/' \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
