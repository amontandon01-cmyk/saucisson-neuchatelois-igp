name: Déployer en préproduction

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: igp-pages-publication
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://amontandon01-cmyk.github.io/saucisson-neuchatelois-igp/preprod/
    steps:
      - name: Refuser toute autre branche que main
        run: test "$GITHUB_REF_NAME" = main
      - name: Récupérer le commit candidat exact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Installer et contrôler le candidat
        run: |
          npm ci
          npm run check
          git diff --exit-code
      - name: Identifier la production actuellement publiée
        id: production
        run: node scripts/resolve-production-revision.mjs
      - name: Vérifier que le SHA de production existe dans Git
        run: git cat-file -e "${{ steps.production.outputs.sha }}^{commit}"
      - name: Récupérer la source de production sans modifier le candidat
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.production.outputs.sha }}
          path: .deploy/production-source
          persist-credentials: false
      - name: Reconstruire la production publiée depuis son SHA
        working-directory: .deploy/production-source
        env:
          NEXT_PUBLIC_DEPLOY_ENV: production
          NEXT_PUBLIC_SITE_URL: https://amontandon01-cmyk.github.io
          NEXT_PUBLIC_BASE_PATH: /saucisson-neuchatelois-igp
          NEXT_PUBLIC_CANONICAL_BASE_PATH: /saucisson-neuchatelois-igp
          NEXT_PUBLIC_RELEASE_SHA: ${{ steps.production.outputs.sha }}
        run: |
          npm ci
          npm run build
      - name: Ajouter le manifeste à la production historique
        run: |
          node scripts/write-release.mjs \
            --root .deploy/production-source/out \
            --environment production \
            --revision "${{ steps.production.outputs.sha }}" \
            --canonical-base-path /saucisson-neuchatelois-igp
      - name: Construire la préproduction non indexable
        env:
          NEXT_PUBLIC_DEPLOY_ENV: preprod
          NEXT_PUBLIC_SITE_URL: https://amontandon01-cmyk.github.io
          NEXT_PUBLIC_BASE_PATH: /saucisson-neuchatelois-igp/preprod
          NEXT_PUBLIC_CANONICAL_BASE_PATH: /saucisson-neuchatelois-igp
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
        run: npm run build
      - name: Composer production et préproduction sans les mélanger
        run: |
          node scripts/compose-pages.mjs \
            .deploy/production-source/out \
            out \
            .deploy/pages
      - name: Charger le paquet GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .deploy/pages
      - name: Publier la préproduction avec la production inchangée
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Vérifier les deux versions réellement servies
        run: |
          node scripts/verify-live.mjs \
            preprod \
            "$GITHUB_SHA" \
            "${{ steps.production.outputs.sha }}"
      - name: Résumer la version à valider
        run: |
          printf 'Préproduction à valider : %s\n\nVersion technique : `%s`\n' \
            'https://amontandon01-cmyk.github.io/saucisson-neuchatelois-igp/preprod/' \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
